<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캣타로 리딩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d1c; --phone:#14162b; --surface:rgba(255,255,255,.07); --surface2:rgba(255,255,255,.12); --line:rgba(255,255,255,.28);
  --text:#ffffff; --muted:rgba(255,255,255,.72); --faint:rgba(255,255,255,.5);
  --gold:#d9b66e; --gold2:#f0d79c; --goldsoft:rgba(217,182,110,.16);
  --sel:#e4e4ef; --seltext:#1c1d33;
  --red:#ff8a80; --ok:#a5e0c0;
  --serif:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  --hand:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --display:"Cinzel","Trajan Pro","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  --skin1:#1d2547; --skin2:#0f1430; --skinA:#d9b66e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#app{width:100%;max-width:430px;min-height:100%;position:relative;display:flex;flex-direction:column;overflow-x:hidden;background:radial-gradient(120% 55% at 85% 0%,rgba(140,120,200,.35),transparent 60%),radial-gradient(90% 50% at 10% 100%,rgba(196,186,240,.55),transparent 70%),linear-gradient(180deg,#121429 0%,#1d2150 32%,#3c3f93 62%,#6d6fd0 84%,#a9a3e3 100%);background-attachment:local}
#app.light{background:radial-gradient(90% 40% at 50% 8%,rgba(255,255,255,.75),transparent 70%),linear-gradient(180deg,#e9e7f4 0%,#c9c2ea 22%,#8d8fe0 46%,#4b4fb0 68%,#20224f 86%,#0e0f22 100%)}
@media(min-width:520px){body{padding:24px 0;background:radial-gradient(1200px 600px at 50% -10%,#231c35,var(--bg))}#app{min-height:calc(100vh - 48px);border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)}}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;position:sticky;top:0;z-index:20;background:linear-gradient(#121429 60%,rgba(18,20,41,0));}
.light .top{background:none;position:relative}
.menu{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.light .menu{color:#141530}
.light .textbtn{color:rgba(255,255,255,.7)}
.mitem{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 2px;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px;text-align:left}
.top.bd{}
.top .ttl{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.top .sub{font-size:13px;color:var(--muted)}
.back{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px}
.back svg{width:20px;height:20px}
.body{flex:1;padding:8px 20px 120px}
.foot{position:sticky;bottom:0;padding:26px 20px calc(18px + env(safe-area-inset-bottom));z-index:15;background:linear-gradient(rgba(28,30,78,0),rgba(28,30,78,.72) 38%)}
.light .foot{background:none}
.btn{width:100%;height:52px;border-radius:12px;background:#e7e7ee;color:#1c1d33;font-weight:700;font-size:16px;transition:.15s;box-shadow:0 6px 20px rgba(10,10,40,.25)}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:rgba(231,231,238,.35);color:rgba(28,29,51,.45);cursor:default;box-shadow:none}
.textbtn{display:block;margin:12px auto 0;font-size:14px;color:var(--muted)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text);font-weight:700;box-shadow:none;backdrop-filter:blur(8px)}
.btnrow{display:flex;gap:10px}
.link{color:var(--gold);font-weight:700;font-size:14px}
.h1{font-size:23px;line-height:1.42;font-weight:800;letter-spacing:-.4px}
.lead{color:var(--muted);font-size:14px;margin-top:8px}
.sec{margin-top:26px}
.sec-t{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:10px;letter-spacing:.2px}
.box{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.box+.box{margin-top:10px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .xs{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;background:var(--surface)}
.chip.gold{border-color:rgba(217,182,110,.5);color:var(--gold2);background:var(--goldsoft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.tag.gold{border-color:var(--gold);color:var(--gold)}
.tag.free{border-color:#4d6b5c;color:var(--ok)}
/* home */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid rgba(255,255,255,.4);border-radius:18px;padding:16px 14px;text-align:left;background:rgba(255,255,255,.06);transition:.15s;backdrop-filter:blur(8px)}
.cat b{display:block;font-size:16px}
.cat span{font-size:12px;color:var(--muted)}
.cat b,.cat span{transition:.15s}
.qopt{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:17px 16px;background:rgba(255,255,255,.06);font-weight:700;font-size:15px;backdrop-filter:blur(8px);transition:.15s}
.qopt+.qopt{margin-top:12px}
.qopt.on{background:var(--sel);color:var(--seltext);border-color:var(--sel)}
.cat.on{background:var(--sel);border-color:var(--sel)}
.cat.on b{color:var(--seltext)}
.cat.on span{color:rgba(28,29,51,.65)}
.qlist .q{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.qlist .q:last-child{border-bottom:0}
.daily{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.hero{position:relative;height:300px;margin:34px -20px 0}
.hero .card{position:absolute;width:150px;height:244px;top:20px;left:50%;font-size:17px;box-shadow:0 18px 40px rgba(10,10,40,.45);border-radius:10px}
.hero .hc0{transform:translateX(-140%) rotate(-8deg);top:44px}
.hero .hc1{transform:translateX(-50%);z-index:2}
.hero .hc2{transform:translateX(40%) rotate(8deg);top:44px}
.arrows{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.arrows .hint{flex:1;padding:0 4px;font-size:11.5px}
/* question */
.qin{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;resize:none;outline:none;min-height:84px;line-height:1.45}
.qin:focus{border-color:var(--gold)}
.cnt{text-align:right;font-size:12px;color:var(--faint);margin-top:6px}
.spread{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{text-align:left;border:1px solid rgba(255,255,255,.4);border-radius:18px;padding:18px 14px;min-height:150px;background:rgba(255,255,255,.06);display:flex;flex-direction:column;justify-content:center;gap:6px;backdrop-filter:blur(8px);transition:.15s}
.scard b{font-size:16px}
.scard span{font-size:12.5px;line-height:1.5;color:var(--muted)}
.scard.on{background:var(--sel);border-color:var(--sel);color:var(--seltext)}
.scard.on span{color:rgba(28,29,51,.7)}
.spread+.spread{margin-top:10px}
.spread.on{background:var(--sel);color:var(--seltext)}
.spread b{font-size:16px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.on .radio{border-color:var(--gold)}
.on .radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
/* cards */
.card{position:relative;border-radius:8px;overflow:hidden;flex:none}
.back-face{width:100%;height:100%;border-radius:inherit;background:linear-gradient(160deg,var(--skin1),var(--skin2));border:1.5px solid var(--skinA);display:flex;align-items:center;justify-content:center;position:relative}
.back-face:before{content:"";position:absolute;inset:4px;border:1px solid color-mix(in srgb,var(--skinA) 45%,transparent);border-radius:5px}
.back-face svg{position:absolute;inset:0;width:100%;height:100%}
.front-face{width:100%;height:100%;border-radius:inherit;background:#15132a;border:2px solid #c9a24a;padding:5%;display:flex;flex-direction:column;gap:4%;box-shadow:inset 0 0 0 1px #6b5420}
.front-face .num{align-self:center;background:#f3e6c4;color:#2a2033;font-family:var(--display);font-weight:700;font-size:.62em;line-height:1;padding:.28em .7em;border-radius:.3em;border:1px solid #9c7b30;min-width:2.4em;text-align:center}
.front-face .art{flex:1;border-radius:4px;overflow:hidden;position:relative;border:1px solid #9c7b30}
.front-face .art svg{position:absolute;inset:0;width:100%;height:100%}
.front-face .nm{background:#f3e6c4;color:#2a2033;font-family:var(--display);font-weight:700;font-size:.5em;letter-spacing:.02em;line-height:1.15;padding:.4em .3em;border-radius:.3em;border:1px solid #9c7b30;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flip{perspective:800px}
.flip .inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.flip .inner>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .inner>div:last-child{transform:rotateY(180deg)}
.flip.open .inner{transform:rotateY(180deg)}
.repeat{outline:2.5px solid var(--red);outline-offset:2px}
/* draw */
.ritual{text-align:center;margin-top:14px}
.ritual .q{font-size:13px;color:var(--muted)}
.deckwrap{position:relative;height:250px;margin:14px -20px 0}
.deck{display:flex;overflow-x:auto;overflow-y:visible;height:250px;padding:44px calc(50% - 40px) 0;scrollbar-width:none;scroll-snap-type:x proximity}
.deck::-webkit-scrollbar{display:none}
.deck .dc{width:80px;height:130px;margin-left:-44px;border-radius:7px;box-shadow:-4px 4px 12px rgba(0,0,0,.35);transform-origin:50% 160%;transition:transform .2s, opacity .3s;cursor:pointer;scroll-snap-align:center}
.deck .dc:first-child{margin-left:0}
.deck .dc.taken{opacity:0;pointer-events:none;width:0;margin-left:0}
.deck .dc.up{z-index:5;position:relative}
.deck .dc.up .back-face{box-shadow:0 0 0 2px var(--gold2),0 10px 24px rgba(0,0,0,.5)}
.hint{text-align:center;font-size:12px;color:var(--faint)}
.slots{display:flex;justify-content:center;gap:14px;margin-top:22px}
.slot{width:78px;text-align:center}
.slot .sl{width:78px;height:126px;border-radius:9px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px}
.slot .sl.next{border-color:var(--gold);color:var(--gold)}
.slot .sl .card{width:100%;height:100%}
.slot p{font-size:13px;margin-top:6px;color:var(--muted)}
.shuffle{height:210px;display:flex;align-items:center;justify-content:center;position:relative}
.shuffle .card{position:absolute;width:64px;height:104px;animation:shuf 1.1s ease-in-out infinite}
@keyframes shuf{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-46px) rotate(-10deg)}75%{transform:translateX(46px) rotate(10deg)}}
.pos-guide{text-align:center;margin-top:6px}
.pos-guide b{font-family:var(--serif);font-size:20px}
.pos-guide p{font-size:13px;color:var(--muted);margin-top:2px}
/* celtic map */
.cmap{position:relative;margin:0 auto}
.cmap .cell{position:absolute;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint);border:1.5px dashed var(--line)}
.cmap .cell.filled{border:0}
.cmap .cell.next{border-color:var(--gold);color:var(--gold)}
.cmap .cell .card{width:100%;height:100%}
.cmap .cell.c2{transform:rotate(90deg);z-index:3}
.cmap .no{position:absolute;top:-7px;left:-7px;width:18px;height:18px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:10px;font-weight:800;color:var(--text);display:flex;align-items:center;justify-content:center;z-index:4}
.cmap .cell.c2 .no{transform:rotate(-90deg)}
/* result */
.qcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.qcard .lbl{font-size:12px;color:var(--muted)}
.qcard .qq{font-family:var(--serif);font-size:19px;font-weight:700;margin-top:2px}
.qcard .meta{font-size:12px;color:var(--faint);margin-top:6px}
.three{display:flex;justify-content:center;gap:12px;margin-top:22px}
.three .col{width:96px;text-align:center;cursor:pointer}
.three .pl{font-size:13px;color:var(--muted);margin-bottom:8px}
.three .card{width:96px;height:156px;font-size:14px}
.three .kw{margin-top:10px;font-weight:700;font-size:14px}
.three .cn{font-size:12px;color:var(--muted)}
.lock{border:1px dashed var(--line);border-radius:14px;padding:13px 16px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.lock svg{flex:none;width:16px;height:16px;margin-top:2px}
/* detail */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -20px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 12px;font-size:14px;color:var(--faint);border-bottom:2px solid transparent;flex:none;font-weight:700}
.tabs button.on{color:var(--text);border-bottom-color:var(--gold)}
.dhead{display:flex;gap:16px;margin-top:18px;align-items:flex-start}
.dhead .card{width:96px;height:156px;font-size:14px}
.dhead h2{font-family:var(--serif);font-size:23px;line-height:1.25}
.dhead .info{font-size:12px;color:var(--muted);margin-top:4px}
.step{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.step summary{list-style:none;padding:13px 16px;font-weight:800;display:flex;justify-content:space-between;cursor:pointer;font-size:15px}
.step summary::-webkit-details-marker{display:none}
.step summary:after{content:"＋";color:var(--faint);font-weight:400}
.step[open] summary:after{content:"－"}
.step .sb{padding:0 16px 15px;font-size:15px;color:#e3dccd}
.step.locked .sb .blur{filter:blur(4.5px);user-select:none;opacity:.7}
.rel{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.rel:first-child{border-top:0;padding-top:0}
.rel .sy{width:22px;height:22px;flex:none;border-radius:6px;background:var(--goldsoft);color:var(--gold2);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.navrow{display:flex;justify-content:space-between;gap:10px}
.navrow .btn{flex:1}
/* summary */
.concl{font-family:var(--serif);font-size:22px;line-height:1.5;font-weight:700;margin-top:6px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ev:first-child{border-top:0;padding-top:2px}
.ev .tag{flex:none;margin-top:2px;min-width:52px;text-align:center}
.act{display:flex;gap:10px;font-size:15px;padding:6px 0}
.act b{color:var(--gold);flex:none}
.upsell{border:1px solid rgba(217,182,110,.55);border-radius:16px;padding:16px;background:linear-gradient(160deg,rgba(217,182,110,.12),rgba(217,182,110,.03))}
.upsell p{font-size:15px}
.upsell .btn{margin-top:12px;height:48px}
.basis{font-size:12px;color:var(--faint);margin-top:22px;line-height:1.7}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(5,3,10,.62);z-index:50;display:flex;justify-content:center;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-width:430px;background:#1b1e44;border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--serif);font-size:21px}
.incl li{list-style:none;padding:5px 0;font-size:14px;display:flex;gap:8px}
.incl li:before{content:"✓";color:var(--gold);font-weight:800}
.bal{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:14px 0;font-size:14px}
.bal b{font-size:16px}
.short{color:var(--red)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#f2ece0;color:#1a1424;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:80;max-width:340px;text-align:center;animation:fade .2s}
.modal{width:calc(100% - 48px);max-width:360px;background:#1b1e44;border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;margin:auto;align-self:center;text-align:center}
.modal h3{font-family:var(--serif);font-size:19px;margin-bottom:6px}
.modal .btnrow{margin-top:18px}
/* skin */
.reveal{display:flex;justify-content:center;margin-top:26px}
.reveal .card{width:150px;height:244px;font-size:18px}
.rar{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;border:1px solid}
.dex{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.dex .d{aspect-ratio:3/5;border-radius:5px;overflow:hidden;opacity:.25}
.dex .d.have{opacity:1}
.dex .d .back-face{border-width:1px}
.dex .d .back-face:before{display:none}
/* chart */
table.ct{width:100%;border-collapse:collapse;font-size:13px}
table.ct th{font-size:11px;color:var(--faint);font-weight:700;text-align:left;padding:0 6px 8px;white-space:nowrap}
table.ct td{padding:8px 6px;border-top:1px solid var(--line);white-space:nowrap}
.bar{display:flex;align-items:center;gap:10px;font-size:13px;margin:7px 0}
.bar .bl{width:64px;color:var(--muted);flex:none}
.bar .bt{flex:1;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar .bf{height:100%;background:var(--faint);border-radius:5px}
.bar.hi .bf{background:var(--gold)}
.bar .bv{width:16px;text-align:right;font-weight:800}
.formula{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);word-break:break-all;margin-top:6px}
.big{font-family:var(--serif);font-size:20px;font-weight:700}
/* records */
.rec{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:13px 16px;background:var(--surface)}
.rec+.rec{margin-top:10px}
.empty{text-align:center;color:var(--faint);padding:60px 0}
.coinpill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.fadein{animation:fadeup .45s both}
#app.noanim .fadein{animation:none}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================= 카드 데이터 ================= */
const SUITS=[
 {key:'wands',name:'완드',area:'의지·행동'},
 {key:'cups',name:'컵',area:'감정'},
 {key:'swords',name:'소드',area:'생각·갈등'},
 {key:'pentacles',name:'펜타클',area:'돈·현실'}
];
const ROMAN=['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];

function jong(w){w=String(w).trim().replace(/[’‘'"”“)\]\s]+$/,'');const ch=w.slice(-1),c=ch.charCodeAt(0);
 if(c>=0xAC00&&c<=0xD7A3)return (c-0xAC00)%28;
 if(/[0-9]/.test(ch))return {0:21,1:8,2:0,3:16,4:0,5:0,6:1,7:8,8:8,9:0}[ch];
 if(/[A-Za-z]/.test(ch))return /[lmnr]/i.test(ch)?8:0; return 0;}

function rng(seed){let a=hash(seed)();return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function makeReading(q,cat,spread,parentId,skin){
 const date=today(),key=readingKey(q,spread,date);
 const ids=shuffled(key).slice(0,SPREADS[spread].n);
 const r={id:'r'+Date.now().toString(36)+Math.floor(Math.random()*1e4),key,date,q:q.trim(),cat,spread,cards:ids,parent:parentId||null,skin:skin||'basic',created:Date.now()};
 MEM.readings.push(r);persist();return r;}

/* ================= 해설 엔진 ================= */
function numInfo(c){
 if(c.court)return {label:`${c.court}`,line:COURT_LINE[c.court]};
 if(c.major){if(c.num<=10)return {label:`숫자 ${c.num}`,line:`${NUMS[c.num][0]}. ${NUM_LINE[c.num]}`};
  const red=String(c.num).split('').reduce((a,b)=>a+ +b,0);return {label:`숫자 ${c.num} → ${red}`,line:`메이저 ${c.num}번은 ${c.num.toString().split('').join('+')}=${red}, ${NUMS[red][0]}. ${NUM_LINE[red]}`};}
 return {label:`숫자 ${c.rank}`,line:`${NUMS[c.rank][0]}. ${NUM_LINE[c.rank]}`};}
function arcLine(c){return c.major?`메이저 아르카나 · ${c.roman} · 정방향`:`마이너 아르카나 · ${c.suitName} · 정방향`;}
function posMeaning(r,i){const c=cardById(r.cards[i]),k=c.kw;
 if(r.spread==='three'){
  if(i===0)return `이 고민은 ${J(`‘${k[0]}’`,'에서','에서')} 시작됐어요. 지나온 시간 속 ${J(k[1],'의','의')} 경험이 지금 판단의 바탕이 되고 있어요.`;
  if(i===1)return `지금 당신은 ${J(`‘${k[0]}’`,'의','의')} 상태에 머물러 있어요. ${J(k[1],'과','와')} ${J(k[2],'이','가')} 현재 마음을 가장 크게 차지하고 있어요.`;
  return `이대로 흐르면 ${J(`‘${k[0]}’`,'으로')} 나아가요. ${J(k[1],'이','가')} 다음 장면의 열쇠가 될 거예요.`;}
 if(r.spread==='one')return `한 장으로 답하면 ${J(`‘${k[0]}’`,'이에요','예요').replace(/이에요$|예요$/,m=>m)}. 지금 질문에 가장 필요한 키워드는 ${EIEYO(k[1])}.`;
 const p=SPREADS.celtic.pos[i];
 return `${i+1}번 ${p.name} : ${p.desc}. 이 자리의 ${J(c.name,'은','는')} ${J(`‘${k[0]}’`,'을','를')} 말해요. ${J(k[1],'과','와')} ${k[2]}의 기운이 이 자리를 채우고 있어요.`;}
function ctxMeaning(r,i){const c=cardById(r.cards[i]),cat=catById(r.cat);const dom=cat.dom[c.major?'major':c.suit];
 let tail;
 if(r.spread==='three')tail=['그동안 이 부분이 결정을 이끌어 왔어요.','지금 결정을 가장 크게 좌우하는 게 바로 이 부분이에요.','앞으로 이 부분이 달라질 가능성이 커요.'][i];
 else if(r.spread==='one')tail='질문에 대한 답의 핵심이 이 부분에 있어요.';
 else tail=['지금 질문의 중심이 여기에 있어요.','이 부분이 생각보다 발목을 잡고 있어요.','겉으로 드러나지 않지만 뿌리 깊은 이유예요.','이미 지나간 일이지만 영향은 남아 있어요.','마음 깊이 바라는 방향이 여기에 있어요.','곧 이 부분에서 움직임이 생겨요.','지금 내 태도가 이렇게 드러나 있어요.','주변 사람과 환경이 이 방향으로 작용해요.','바라는 동시에 두려운 것이 이 부분이에요.','이대로 가면 이 부분이 결말을 정해요.'][i];
 const label=cat.id==='free'?'지금 질문':`${cat.label} 고민`;
 return `${label}에 비추면, ${J(c.name,'은','는')} ${dom}에서 읽혀요. ${J(`‘${c.kw[0]}’`,'이','가')} 그 부분에 그대로 나타나 있어요. ${tail}`;}
function relSentence(a,b,sym){const A=cardById(a),B=cardById(b);
 if(sym==='×')return `${A.name}의 ${J(A.kw[0],'을','를')} ${B.name}의 ${J(B.kw[0],'이','가')} 가로지르고 있어요`;
 if(sym==='=num')return `같은 숫자 ${A.num}, ${NUMS[A.num][1]} 단계가 겹쳐요`;
 if(sym==='=suit')return `같은 ${A.suitName} 흐름, ${A.area} 이야기가 이어져요`;
 const up=(A.num!=null&&B.num!=null)?(B.num>A.num?'커지며':B.num<A.num?'줄어들며':''):'';
 return `${J(A.kw[0],'이','가')} ${up?`숫자가 ${up} `:''}${B.kw[0]} 쪽으로 이어져요`;}
function relationsFor(r,i){const ids=r.cards,me=ids[i],C=cardById(me),out=[];
 const add=(sym,other,text)=>{if(out.length<3&&!out.some(o=>o.other===other))out.push({sym,other,text});};
 if(r.spread==='celtic'){if(i===0)add('×',ids[1],relSentence(ids[0],ids[1],'×'));if(i===1)add('×',ids[0],relSentence(ids[0],ids[1],'×'));}
 ids.forEach((o,j)=>{if(j===i)return;const O=cardById(o);if(C.num!=null&&O.num!=null&&C.num===O.num&&C.num<=10)add('=',o,relSentence(me,o,'=num'));});
 ids.forEach((o,j)=>{if(j===i)return;const O=cardById(o);if(!C.major&&C.suit===O.suit)add('=',o,relSentence(me,o,'=suit'));});
 const nextIdx=r.spread==='celtic'?(i===0?9:(i===9?4:i+1)):(i<ids.length-1?i+1:i-1);
 if(nextIdx>=0&&nextIdx!==i)add('→',ids[nextIdx],relSentence(me,ids[nextIdx],'→'));
 for(let j=0;out.length<2&&j<ids.length;j++)if(j!==i)add('→',ids[j],relSentence(me,ids[j],'→'));
 return out;}
function teaser(r,i){const ids=r.cards;const o=i>0?ids[i-1]:ids[i+1];if(o==null)return '';const A=cardById(o),B=cardById(ids[i]);
 return i>0?`${A.name}의 ${J(`‘${A.kw[0]}’`,'을','를')} ${B.name}의 ${J(`‘${B.kw[0]}’`,'이','가')}…`:`${B.name}의 ${J(`‘${B.kw[0]}’`,'은','는')} 다음 카드 ${A.name}의…`;}
function majorLine(n,m){const maj=m;if(n===1)return maj?'삶의 큰 흐름이 걸린 답이에요':'지금의 일상적 선택에 관한 답이에요';
 return ['지금의 일상적 선택에 관한 리딩이에요','일상의 고민이 큰 전환으로 이어지는 흐름이에요','삶의 큰 방향이 걸린 리딩이에요','인생의 큰 전환점에 서 있는 리딩이에요'][Math.min(maj,3)];}
function numFlow(ids){const cs=ids.map(cardById).filter(c=>c.num!=null);if(cs.length<2)return null;
 const ns=cs.map(c=>c.num);let up=0,down=0;for(let i=1;i<ns.length;i++){if(ns[i]>ns[i-1])up++;else if(ns[i]<ns[i-1])down++;}
 const desc=down&&!up?'쥔 것을 내려놓고 단순해지는 흐름':up&&!down?'작은 시작이 점점 커지는 흐름':'오르내리며 방향을 찾는 흐름';
 return {text:ns.join(' → '),desc};}
function quint(ids){const cs=ids.map(cardById).filter(c=>c.num!=null);const parts=cs.map(c=>c.num);let s=parts.reduce((a,b)=>a+b,0);const steps=[s];
 while(s>21){s=String(s).split('').reduce((a,b)=>a+ +b,0);steps.push(s);}return {parts,steps,card:CARDS[s]};}
function suitDist(ids){const d={wands:0,cups:0,swords:0,pentacles:0,major:0};ids.forEach(id=>{const c=cardById(id);d[c.major?'major':c.suit]++;});return d;}
const AREA_NAME={pentacles:'돈·현실',wands:'의지·행동',cups:'감정',swords:'생각·갈등',major:'큰 흐름'};
const AREA_SHORT={pentacles:'현실',wands:'의지',cups:'감정',swords:'생각',major:'큰 흐름'};
function keyCard(r){const order=[4,0,9,1,2,3,5,6,7,8];for(const i of order)if(cardById(r.cards[i]).major)return i;return 9;}
function celticSummaryLine(r){const d=suitDist(r.cards);const parts=[`메이저 ${d.major}`];
 const ss=['pentacles','wands','cups','swords'].map(k=>[k,d[k]]).sort((a,b)=>b[1]-a[1]);ss.filter(s=>s[1]>=2).forEach(s=>parts.push(`${SUITS.find(x=>x.key===s[0]).name} ${s[1]}`));
 const [a,b]=ss;let tail;if(a[1]===b[1])tail=`${J(AREA_SHORT[a[0]],'과','와')} ${J(AREA_SHORT[b[0]],'이','가')} 팽팽한 배열`;else tail=`${J(AREA_SHORT[a[0]],'이','가')} 중심인 배열`;
 if(d.major>=4)tail='큰 흐름이 강하게 작용하는 배열';return parts.join(' · ')+' : '+tail;}
function pickActs(r,n){const cat=catById(r.cat),rr=rng(r.key+'act');const a=[...cat.acts];for(let i=a.length-1;i>0;i--){const j=Math.floor(rr()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}
function conclusion(r){const cs=r.cards.map(cardById);
 if(r.spread==='one')return `${J(`‘${cs[0].kw[0]}’`,'이','가')} 이 질문의 답이에요. ${cs[0].kw[1]}에 마음을 두어 보세요.`;
 if(r.spread==='three')return `지금은 ${J(`‘${cs[1].kw[0]}’`,'에','에')} 머물러 있지만, 흐름은 ${`‘${cs[2].kw[0]}’`} 쪽으로 열려 있어요.`;
 return `${J(`‘${cs[1].kw[0]}’`,'이','가')} 발목을 잡고 있지만, 결국 ${J(`‘${cs[9].kw[0]}’`,'으로')} 나아가는 흐름이에요.`;}
function parentOf(r){return r.parent?MEM.readings.find(x=>x.id===r.parent):null;}
function repeats(r){const p=parentOf(r);if(!p)return [];const out=[];r.cards.forEach((id,i)=>{const j=p.cards.indexOf(id);if(j>=0)out.push({id,from:SPREADS[p.spread].pos[j].name,to:SPREADS.celtic.pos[i].name,i});});return out;}

 let guide;
 if(d.spread==='celtic'){const p=sp.pos[Math.min(k,n-1)];guide=done?`<div class="pos-guide"><b>10장을 모두 골랐어요</b><p>선택완료를 누르면 카드가 공개돼요</p></div>`:`<div class="pos-guide"><b>${k+1}번 · ${J(p.name,'을','를')} 골라주세요</b><p>${p.desc}</p></div>`;}
 else guide=`<div class="ritual"><h2 class="h1" style="font-size:20px">마음속으로 질문을 떠올려보세요</h2><p class="small muted" style="margin-top:6px">“${esc(d.q)}”<br>지금 가장 마음에 걸리는 일을 생각하며 ${n}장을 골라주세요</p></div>`;
 const slots=d.spread==='celtic'?`<div style="margin-top:14px">${celticMap(null,{picked:k,w:30,h:48,next:!done})}</div>`
 :`<div class="slots">${sp.pos.map((p,i)=>`<div class="slot"><div class="sl ${i===k?'next':''}">${i<k?cardHTML(null,{cls:'fadein'}):p.name}</div><p>${p.name}</p></div>`).join('')}</div>`;
 return `<div class="top"><button class="back" onclick="back()">${ICON.back}</button><div class="sub">${Math.min(k+(done?0:1),n)} / ${n}</div></div>
<div class="body" style="padding-bottom:170px">${d.spread==='celtic'?`<p class="small muted" style="text-align:center">“${esc(d.q)}”</p>`:''}${guide}${deck}${slots}
 ${done?'':`<button class="textbtn" style="margin-top:14px;text-decoration:underline" onclick="autoDraw()">${d.spread==='celtic'?'남은 카드 자동으로 뽑기':'자동으로 뽑기'}</button>`}</div>
<div class="foot"><button class="btn" ${done?'':'disabled'} onclick="reveal()">${done?'선택완료':`카드 ${n-k}장을 더 골라주세요`}</button><button class="textbtn" onclick="S.draw=null;home();go('cats')">고민 다시 선택</button></div>`;};
function nudge(dir){const dk=$('#deck');if(dk)dk.scrollBy({left:dir*dk.clientWidth*.6,behavior:'smooth'});}
function centerDeck(){const dk=$('#deck');if(!dk)return;dk.scrollLeft=(dk.scrollWidth-dk.clientWidth)/2;arc();}
function arc(){{const dk=$('#deck');if(!dk)return;const r=dk.getBoundingClientRect(),cx=r.left+r.width/2;
 dk.querySelectorAll('.dc').forEach(el=>{const b=el.getBoundingClientRect();const off=(b.left+b.width/2-cx)/r.width;const up=el.classList.contains('up');el.style.transform=`translateY(${off*off*70-(up?26:0)}px) rotate(${off*28}deg)`;});}}
function tapCard(i){const d=S.draw;if(d.picks.length>=SPREADS[d.spread].n)return;
 if(d.up!==i){d.up=i;document.querySelectorAll('.dc.up').forEach(e=>e.classList.remove('up'));document.querySelector(`.dc[data-i="${i}"]`).classList.add('up');arc();return;}
 d.picks.push(i);d.up=null;const sl=$('#deck').scrollLeft;render();const dk=$('#deck');if(dk){dk.scrollLeft=sl;arc();}}
function autoDraw(){const d=S.draw;const n=SPREADS[d.spread].n;const free=CARDS.map((_,i)=>i).filter(i=>!d.picks.includes(i));

/* 켈틱 미니맵 / 배열 */
function celticLayout(w,h){const g=Math.max(5,w*.12),side=h/2+w/2+g,cx=side+w/2+2,cy=h+g,sx=cx+side+w/2+g*2.5+w/2,st=h+g*.6;
 return [[cx,cy],[cx,cy],[cx,cy+h+g],[cx-side,cy],[cx,cy-h-g],[cx+side,cy],[sx,cy+st*1.5],[sx,cy+st*.5],[sx,cy-st*.5],[sx,cy-st*1.5]];}
function celticMap(r,o){const w=o.w,h=o.h,L=celticLayout(w,h);const minY=Math.min(...L.map(p=>p[1]))-h/2,maxY=Math.max(...L.map(p=>p[1]))+h/2,maxX=Math.max(...L.map(p=>p[0]))+w/2+4;
 const rep=r?repeats(r).map(x=>x.i):[];
 const cells=L.map(([x,y],i)=>{const filled=r?true:i<o.picked;const next=!r&&o.next&&i===o.picked;
  const ww=w,hh=h;const left=x-ww/2,top=y-hh/2-minY+8;
  const inner=r?cardHTML(cardById(r.cards[i]),{flip:true,open:!S.fresh,cls:(rep.includes(i)?'repeat ':'')+'rv',attr:`style="font-size:${o.fs||9}px"`}):(filled?cardHTML(null):(i+1));
  return `<div class="cell ${i===1?'c2':''} ${filled?'filled':''} ${next?'next':''}" style="left:${left}px;top:${top}px;width:${ww}px;height:${hh}px;" ${r?`onclick="openDetail(${i})"`:''}>${r||filled?`<span class="no">${i+1}</span>`:''}${inner}</div>`;}).join('');
 return `<div class="cmap" style="width:${maxX}px;height:${maxY-minY+16}px">${cells}</div>`;}

<div class="foot"><button class="btn" onclick="go('chart')">리딩 차트 보기</button></div>`;};

/* SC-P05 */
V.chart=()=>{const r=S.reading,cs=r.cards.map(cardById),d=suitDist(r.cards),pos=SPREADS.celtic.pos;
 const rows=cs.map((c,i)=>`<tr><td>${i+1} ${pos[i].name}</td><td><b>${esc(c.name)}</b></td><td>${c.num==null?'-':c.num}</td><td>${c.major?'메이저':'마이너'}</td><td>${esc(c.kw[0])}</td></tr>`);
 const order=['pentacles','wands','cups','swords','major'];const top2=[...order].sort((a,b)=>d[b]-d[a]).slice(0,2);const mx=Math.max(...order.map(k=>d[k]),1);
 const courts=cs.filter(c=>c.court).length;
 const cnt={};cs.forEach(c=>{if(c.num!=null&&c.num<=10)cnt[c.num]=(cnt[c.num]||0)+1;});
 const reps=[];cs.forEach(c=>{if(c.num!=null&&cnt[c.num]>1&&!reps.includes(c.num))reps.push(c.num);});
 const qt=quint(r.cards);const ki=keyCard(r),kc=cs[ki];
 return `${topBar('리딩 차트','켈틱크로스')}
<div class="body">
 <div class="box"><div class="sec-t" style="margin:0 0 8px">대응표 (10행)</div><div style="overflow-x:auto"><table class="ct"><tr><th>자리</th><th>카드</th><th>숫자</th><th>아르카나</th><th>키워드</th></tr>${rows.slice(0,S.chartAll?10:4).join('')}</table></div>
 ${S.chartAll?'':`<button class="link small" style="margin-top:8px" onclick="S.chartAll=true;render()">… 펼쳐보기</button>`}</div>
 <div class="box"><div class="sec-t" style="margin:0 0 4px">삶의 영역 분포</div>${order.map(k=>`<div class="bar ${top2.includes(k)&&d[k]>0?'hi':''}"><span class="bl">${AREA_NAME[k]}</span><span class="bt"><span class="bf" style="display:block;width:${d[k]/mx*100}%"></span></span><span class="bv">${d[k]}</span></div>`).join('')}
 <div class="small muted" style="margin-top:6px">${celticSummaryLine(r).split(' : ')[1]}</div></div>
 <div class="chips" style="margin-top:10px"><button class="chip" onclick="toast('${d.major>=5?'큰 흐름이 상황을 이끌고 있어요':'대부분 내 선택으로 바꿀 수 있는 일이에요'}')">메이저 ${d.major}/10</button><button class="chip" onclick="toast('${courts?'사람이 이 문제에 크게 얽혀 있어요':'사람보다 상황 자체가 중심이에요'}')">코트 ${courts}</button><button class="chip" onclick="toast('모두 정방향 : 에너지가 막힘없이 드러나 있어요')">역방향 0</button></div>
 <div class="box" style="margin-top:10px"><div class="xs muted">숫자 흐름</div><div style="margin-top:2px">${reps.length?`<b>${reps.map(n=>`${n} ×${cnt[n]}`).join(' → ')}</b> ${reps.length>1?`${NUMS[reps[0]][1]} 단계에서 ${NUMS[reps[reps.length-1]][1]} 단계로`:`${NUMS[reps[0]][1]} 단계가 반복돼요`}`:'반복되는 숫자 없이 각자 다른 단계 : 상황이 여러 갈래로 나뉘어 있어요'}</div></div>
 <div class="box"><div class="xs muted">퀸테센스</div><div class="formula">${qt.parts.join('+')||'0'} = ${qt.steps.join(' → ')}</div><div class="big" style="margin-top:4px">${qt.card.num} ${qt.card.name}</div><div class="small muted">이 리딩은 결국 ${J(`‘${qt.card.kw[0]}’`,'에','에')} 관한 이야기예요 (코트 카드는 계산에서 제외)</div></div>
 <button class="box" style="width:100%;text-align:left;margin-top:10px;border-color:var(--gold)" onclick="openDetail(${ki})"><div class="xs muted">핵심 카드</div><div class="big" style="margin-top:2px">${kc.major?kc.roman+' ':''}${kc.name} <span class="small muted" style="font-family:var(--sans);font-weight:400">· ${ki+1}번 ${pos[ki].name} 자리</span></div><div class="small muted">${kc.mean.split('. ')[0]}.</div></button>
</div>
<div class="foot"><button class="btn" onclick="openDetail(0)">카드별 해설 보기</button></div>`;};

/* SC-P06 */
V.detail10=()=>{const r=S.reading,pos=SPREADS.celtic.pos,i=S.idx,c=cardById(r.cards[i]),ni=numInfo(c),rep=repeats(r).find(x=>x.i===i),rels=relationsFor(r,i);
 const gd=c.major?`생명나무 경로 ${c.id+11}`:(c.court?`궁정 카드 · ${SEPH[COURT_SEPH[c.court]]}`:`${GD[c.suit][c.rank-1]}`);
 const tree=c.major?`메이저 ${c.roman} · 히브리 문자 경로`:(c.court?`${c.suitName}의 ${c.court}`:`생명나무 ${c.rank} · ${SEPH[c.rank]}`);
 const prevName=i>0?`${i} ${cardById(r.cards[i-1]).name}`:'차트',nextName=i<9?`${i+2} ${cardById(r.cards[i+1]).name}`:null;
 const p=parentOf(r);
 return `${topBar('카드 해설',`${i+1} / 10 · ${pos[i].name}`)}
<div class="body">
 <div class="tabs">${pos.map((_,j)=>`<button class="${j===i?'on':''}" onclick="S.idx=${j};render()">${j+1}</button>`).join('')}</div>
 <div class="dhead fadein">${cardHTML(c,{cls:rep?'repeat':''})}<div><h2>${esc(c.name)}</h2><div class="info">${arcLine(c)}</div>${rep?`<div class="small" style="color:var(--red);margin-top:4px">쓰리카드에서도 ${rep.from} 자리</div>`:''}
 <div class="box" style="margin-top:10px;padding:10px 12px"><div class="xs muted">골든던 칭호</div><div class="small"><b>${gd}</b></div><div class="xs muted" style="margin-top:4px">${tree}</div></div></div></div>
 <div class="chips" style="margin-top:14px">${c.kw.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}<span class="chip gold">${ni.label}</span></div>
 <details class="step" open><summary>① 카드의 의미</summary><div class="sb">${c.mean}<div class="small muted" style="margin-top:6px">${ni.line}</div></div></details>
 <details class="step" open><summary>② ${i+1}번 ${pos[i].name} 자리에서</summary><div class="sb">${posMeaning(r,i)}</div></details>
 <details class="step" open><summary>③ 내 질문에 비추면</summary><div class="sb">${ctxMeaning(r,i)}</div></details>
 <details class="step" open><summary>④ 다른 카드와의 관계</summary><div class="sb">${rels.map(x=>`<div class="rel"><span class="sy">${x.sym}</span><div><b>${r.cards.indexOf(x.other)+1} ${esc(cardById(x.other).name)}</b><div class="small" style="color:#d6cfbf">${x.text}</div></div></div>`).join('')}</div></details>
 ${rep&&p?`<div class="box" style="margin-top:12px"><div class="xs muted">무료 리딩과의 연결</div><div style="margin-top:2px">쓰리카드에서는 ${rep.from} 자리의 ${J(`‘${c.kw[0]}’`,'이었고','였고')}, 여기서는 ${rep.to} 자리에서 그 이유까지 보여요</div></div>`:''}
</div>
<div class="foot navrow"><button class="btn ghost" onclick="${i>0?'S.idx--;render();scrollTo(0,0)':"go('chart')"}">← ${esc(prevName)}</button>
${nextName?`<button class="btn" onclick="S.idx++;render();scrollTo(0,0)">${esc(nextName)} →</button>`:`<button class="btn" onclick="go('summary10')">종합 리딩 보기</button>`}</div>`;};

/* SC-P07 */
V.summary10=()=>{const r=S.reading,cs=r.cards.map(cardById),pos=SPREADS.celtic.pos,d=suitDist(r.cards),qt=quint(r.cards),ki=keyCard(r),p=parentOf(r);
 const cnt={};cs.forEach(c=>{if(c.num!=null&&c.num<=10)cnt[c.num]=(cnt[c.num]||0)+1;});const reps=[];cs.forEach(c=>{if(c.num!=null&&cnt[c.num]>1&&!reps.includes(c.num))reps.push(c.num);});
 const numEv=reps.length>1?`${reps[0]} → ${reps[reps.length-1]}`:(reps.length?`${reps[0]} 반복`:numFlow(r.cards)?.text.split(' → ').slice(0,3).join(' → ')||'-');
 const numD=reps.length>1?`${NUMS[reps[0]][1]} 단계에서 ${NUMS[reps[reps.length-1]][1]} 단계로`:(reps.length?`${NUMS[reps[0]][1]} 단계가 겹쳐 강조됨`:'숫자가 보여주는 단계의 흐름');
 const top=['pentacles','wands','cups','swords','major'].sort((a,b)=>d[b]-d[a]);
 const evs=[['숫자',numEv,numD],['퀸테센스',`${qt.card.num} ${qt.card.name}`,`결국 ${qt.card.kw[0]}의 문제`],['핵심',cs[ki].name,`${pos[ki].name} 자리 · ${cs[ki].kw[0]}`],['관계',`${cs[0].name} × ${cs[1].name}`,`${J(cs[0].kw[0],'을','를')} ${J(cs[1].kw[0],'이','가')} 가로지름`],['영역',`${AREA_SHORT[top[0]]} ${d[top[0]]} · ${AREA_SHORT[top[1]]} ${d[top[1]]}`,d[top[0]]===d[top[1]]?'균형':`${AREA_SHORT[top[0]]} 중심`]];
 const saved=MEM.saved.includes(r.id);
 return `${topBar('종합 리딩','켈틱크로스')}
<div class="body">
 <div class="sec-t" style="margin-top:6px">결론</div>
 <div class="concl fadein">“${conclusion(r)}”</div>
 <div class="sec"><div class="sec-t">근거 5</div><div class="box">${evs.map(e=>`<div class="ev"><span class="tag gold">${e[0]}</span><div><b>${esc(e[1])}</b><div class="small muted">${esc(e[2])}</div></div></div>`).join('')}</div></div>
 <div class="sec"><div class="sec-t">지금 해볼 것</div><div class="box">${pickActs(r,3).map((a,i)=>`<div class="act"><b>${i+1}.</b><span>${a}</span></div>`).join('')}</div></div>
 ${p?`<div class="sec"><div class="sec-t">쓰리카드와 비교하면</div><div class="box">쓰리카드의 결론은 “${conclusion(p)}”였어요.<br><span class="muted">여기에 무엇이 막고 있는지(${cs[1].name} : ${cs[1].kw[0]})와 어디로 가는지(${cs[9].name} : ${cs[9].kw[0]})가 더해졌어요.</span></div></div>`:''}
 <p class="basis">라이더-웨이트 · 수비학 · 골든던 칭호 · 켈틱크로스(웨이트식)<br>타로는 스스로를 돌아보는 도구예요. 중요한 결정은 현실 조건과 함께 판단하세요.</p>
</div>
<div class="foot btnrow"><button class="btn ghost" onclick="saveReading()">${saved?'저장됨 ✓':'기록 저장'}</button><button class="btn" onclick="share()">공유하기</button></div>`;};

/* 오늘의 운세 */
V.daily=()=>{const id=shuffled('daily|'+today())[0],c=cardById(id),ni=numInfo(c);const sk=SKINS[0];
 return `${topBar('오늘의 운세',dotDate(today()))}
<div class="body" style="text-align:center">
 <p class="small muted" style="margin-top:6px">하루 한 장, 오늘의 카드</p>
 <div class="reveal"><div class="card flip ${S.dailyOpen?'open':''}" id="dcard" onclick="openDaily()" style="width:150px;height:244px;font-size:18px"><div class="inner"><div>${backHTML(sk)}</div><div>${frontHTML(c,sk)}</div></div></div></div>
 ${S.dailyOpen?`<div class="fadein" style="text-align:left;margin-top:22px"><h2 class="h1" style="text-align:center">${c.name}</h2><div class="chips" style="justify-content:center;margin-top:10px">${c.kw.map(k=>`<span class="chip">${k}</span>`).join('')}</div>
 <div class="box" style="margin-top:16px">${c.mean}</div><div class="box"><div class="xs muted">${ni.label}</div>${ni.line}</div>
 <div class="box"><div class="xs muted">오늘의 한 줄</div>오늘은 ${J(`‘${c.kw[0]}’`,'을','를')} 떠올리며 하루를 보내보세요. ${J(c.kw[1],'이','가')} 작은 힌트가 될 거예요.</div></div>`:'<p class="small muted" style="margin-top:16px">카드를 탭해서 열어보세요</p>'}
</div>
<div class="foot"><button class="btn ghost" onclick="home()">고민 리딩하러 가기</button></div>`;};
function openDaily(){if(S.dailyOpen)return;$('#dcard').classList.add('open');setTimeout(()=>{S.dailyOpen=true;render();},750);}

/* 기록 */
V.records=()=>{const list=[...MEM.readings].sort((a,b)=>b.created-a.created);
 return `${topBar('리딩 기록',`${coin(MEM.wallet)}`)}
<div class="body">${list.length?list.map(r=>`<button class="rec" onclick="openReading('${r.id}')"><div style="display:flex;justify-content:space-between"><span class="xs muted">${dotDate(r.date)} · ${SPREADS[r.spread].name} · ${catById(r.cat).label}</span>${MEM.saved.includes(r.id)?'<span class="xs" style="color:var(--gold)">저장됨</span>':''}</div><div style="font-weight:700;margin-top:2px">“${esc(r.q)}”</div><div class="small muted">${r.cards.slice(0,3).map(id=>cardById(id).name).join(' · ')}${r.cards.length>3?' 외':''}</div></button>`).join(''):'<div class="empty">아직 리딩 기록이 없어요</div>'}
${list.length?`<button class="link small" style="display:block;margin:24px auto 0;color:var(--faint)" onclick="resetAll()">기록 · 코인 초기화</button>`:''}</div>`;};
function resetAll(){if(!confirm('이 기기에 저장된 리딩 기록, 코인, 덱 도감을 모두 초기화할까요?'))return;MEM={readings:[],wallet:20,inv:['basic'],saved:[]};persist();home();}

/* ================= 렌더 ================= */
function render(){const v=V[S.screen]||V.home;const app=document.getElementById('app');app.className=(S.screen==='home'?'light ':'')+(render.last===S.screen?'noanim':'');render.last=S.screen;app.innerHTML=v()+overlayHTML();
 if(['result','result10'].includes(S.screen))flipAll();}
window.addEventListener('resize',arc);
render();
</script>
</body>
</html>
